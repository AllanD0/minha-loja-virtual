<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Minha Loja Virtual</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>

<body>

  
  <div class="bg-dark text-white text-center py-2">
    Frete grátis em compras acima de R$ 199!
  </div>
<nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">Minha Loja</a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#menuLoja"
      aria-controls="menuLoja"
      aria-expanded="false"
      aria-label="Abrir menu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menuLoja">
      <ul class="navbar-nav me-auto mb-3 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" href="#" aria-current="page">
            Início
          </a>
        </li>

        <li class="nav-item dropdown">
          <button
            class="nav-link dropdown-toggle"
            type="button"
            data-bs-toggle="dropdown"
            aria-expanded="false">
            Categorias
          </button>

          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#categorias">Eletrônicos</a></li>
            <li><a class="dropdown-item" href="#categorias">Roupas</a></li>
            <li><a class="dropdown-item" href="#categorias">Calçados</a></li>
            <li><a class="dropdown-item" href="#categorias">Acessórios</a></li>
            <li><a class="dropdown-item" href="#categorias">Casa</a></li>
            <li><a class="dropdown-item" href="#categorias">Esportes</a></li>
          </ul>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="#destaques">Destaques</a>
        </li>
      </ul>

      <button class="btn btn-outline-dark text-nowrap" type="button">
        Carrinho
        <span class="badge bg-danger" id="quantidadeCarrinho">0</span>
        <span class="visually-hidden">itens</span>
      </button>
    </div>

    <form class="d-flex col-12 col-lg-3 gap-2 mt-3 mt-lg-0 ms-lg-3" role="search">
      <input
        class="form-control"
        type="search"
        id="buscaProdutos"
        placeholder="Buscar produtos"
        aria-label="Buscar produtos">
      <button class="btn btn-dark" type="submit">Buscar</button>
    </form>
  </div>
</nav>
  <main class="container my-4">
    <h1>Minha Loja Virtual</h1>
    <p>Encontre produtos incríveis por aqui.</p>

  </main>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
  </script>

</body>
</html>
